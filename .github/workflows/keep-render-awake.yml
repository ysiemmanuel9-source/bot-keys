name: Mantener bot activo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Despertar Render
        run: |
          for intento in 1 2 3 4; do
            echo "Ping $intento/4 a Render"
            curl --fail --silent --show-error --max-time 60 https://bot-keys-1iet.onrender.com/ || true
            if [ "$intento" -lt 4 ]; then
              sleep 60
            fi
          done
